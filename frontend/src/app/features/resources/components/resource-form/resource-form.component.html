 <div class="modal-overlay" (click)="cancel.emit()">
    <div class="modal-content" (click)="$event.stopPropagation()">

      <h2>{{ mode() === 'create' ? 'Novo Recurso 🌸' : 'Editar Recurso ✏️' }}</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>TÍTULO</label>
          <input formControlName="title" placeholder="Ex: Introdução ao React" />
        </div>

        <div class="form-group">
          <label>TIPO</label>
          <div class="type-selector">
              @for (t of types; track $index) {
                  <button
                      type="button"
                      [class.active]="form.value.type === t.value"
                      (click)="form.patchValue({ type: t.value })">
                      {{ t.icon }} {{ t.label }}
                  </button>
              }
          </div>
        </div>
  
        <div class="form-group">
          <label>URL</label>
          <input formControlName="url" placeholder="https://..." />
        </div>

        <div class="form-group">
          <label>DESCRIÇÃO</label>
          <textarea
            formControlName="description"
            placeholder="Descreva o recurso...">
          </textarea>
          <button
            type="button"
            class="btn-ai"
            (click)="onGenerateAi()"
            [disabled]="aiLoading()">
            {{ aiLoading() ? '⏳ Gerando...' : 'Gerar Descrição com IA ✨' }}
          </button>
        </div>

        <div class="form-group">
          <label>TAGS</label>
          <div class="tags-input">
            <span class="tag" *ngFor="let tag of tags">
              {{ tag }}
              <button type="button" (click)="removeTag(tag)">×</button>
            </span>
            <input
              #tagInput
              placeholder="Adicionar tag..."
              (keydown.enter)="addTag(tagInput.value); tagInput.value = ''; $event.preventDefault()"
            />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" [disabled]="form.invalid || formLoading()">
            @if (formLoading()) {
              ⏳ Salvando...
            } @else {
              {{ mode() === 'create' ? 'Adicionar Recurso 💖' : 'Salvar Alterações 💖' }}
            }
          </button>
          <button type="button" class="btn-secondary" (click)="cancel.emit()">
            Cancelar
          </button>
        </div>

      </form>
    </div>
  </div>
